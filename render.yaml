services:
  - type: web
    name: club-void-api-sandbox
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-hosting.txt
    startCommand: gunicorn --config gunicorn.conf.py app:app
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: FINTOC_SANDBOX_ENABLED
        value: "true"
      - key: FINTOC_SECRET_KEY
        sync: false
      - key: FINTOC_PUBLIC_KEY
        sync: false
      - key: FINTOC_CHECKOUT_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
