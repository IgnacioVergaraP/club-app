<div [formGroup]="group"><h2>Identidad visual </h2><p class="hint">Archivos locales en memoria. Las imágenes y colores solo cambian esta vista previa; no se publican ni reemplazan la marca de otras pantallas.</p><div class="fields"><label>Logo desde el dispositivo<input id="settings-logo-file" type="file" accept="image/jpeg,image/png,image/webp" [disabled]="loading.logo" [attr.aria-busy]="loading.logo" (change)="imageSelected.emit({kind:'logo',event:$event})"><small>JPG, PNG o WEBP, máximo 5 MB. El logo inicial reutiliza el recurso aprobado del club.</small><small *ngIf="loading.logo" role="status">Preparando logo…</small><small *ngIf="errors.logo" id="settings-logo-error" class="error" role="alert">{{errors.logo}}</small></label><label>Portada desde el dispositivo<input id="settings-cover-file" type="file" accept="image/jpeg,image/png,image/webp" [disabled]="loading.cover" [attr.aria-busy]="loading.cover" (change)="imageSelected.emit({kind:'cover',event:$event})"><small>JPG, PNG o WEBP, máximo 5 MB. No se sube ningún archivo.</small><small *ngIf="loading.cover" role="status">Preparando portada…</small><small *ngIf="errors.cover" id="settings-cover-error" class="error" role="alert">{{errors.cover}}</small></label>
<label>Color principal *<div class="color-field"><input id="settings-primary-picker" type="color" [value]="color('primary')" (input)="pickColor('primary',$event)" aria-label="Elegir color principal"><input id="settings-primary" type="text" formControlName="primary" maxlength="7" [attr.aria-invalid]="invalid('primary')" aria-label="Color principal hexadecimal"></div><small *ngIf="invalid('primary')" class="error">Usa un color hexadecimal de seis dígitos, como #4b1e66.</small></label>
<label>Color secundario *<div class="color-field"><input id="settings-secondary-picker" type="color" [value]="color('secondary')" (input)="pickColor('secondary',$event)" aria-label="Elegir color secundario"><input id="settings-secondary" type="text" formControlName="secondary" maxlength="7" [attr.aria-invalid]="invalid('secondary')" aria-label="Color secundario hexadecimal"></div><small *ngIf="invalid('secondary')" class="error">Usa un color hexadecimal de seis dígitos, como #c77af7.</small></label></div></div>
