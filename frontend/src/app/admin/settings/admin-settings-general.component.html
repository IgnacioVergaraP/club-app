<div [formGroup]="group"><h2>Información general</h2><p class="hint">Copia ficticia de la identidad inicial. Guardar aquí no cambia la aplicación del cliente ni el resto del panel.</p><div class="fields"><label>Nombre comercial *<input id="settings-name" formControlName="tradeName" [maxlength]="limits.name" [attr.aria-invalid]="invalid('tradeName')" aria-required="true"><small *ngIf="invalid('tradeName')" class="error">Nombre obligatorio, hasta 80 caracteres.</small></label><label>Ciudad *<input id="settings-city" formControlName="city" [maxlength]="limits.city" [attr.aria-invalid]="invalid('city')" aria-required="true"><small *ngIf="invalid('city')" class="error">Indica una ciudad ficticia, hasta 80 caracteres.</small></label><label class="wide">Descripción del club *<textarea id="settings-description" formControlName="description" rows="3" [maxlength]="limits.description" [attr.aria-invalid]="invalid('description')" aria-required="true"></textarea><small *ngIf="invalid('description')" class="error">Descripción obligatoria, hasta 600 caracteres.</small></label><label class="wide">Dirección ficticia *<input id="settings-address" formControlName="address" [maxlength]="limits.address" [attr.aria-invalid]="invalid('address')" aria-required="true"><small *ngIf="invalid('address')" class="error">Dirección obligatoria, hasta 180 caracteres.</small></label><label>País DEMO *<input id="settings-country" formControlName="country" [maxlength]="limits.country" [attr.aria-invalid]="invalid('country')" aria-required="true"><small *ngIf="invalid('country')" class="error">País obligatorio, hasta 60 caracteres.</small></label><label>Zona horaria (fija)<input id="settings-timezone" formControlName="timezone" readonly aria-readonly="true"></label><label>Moneda (fija)<input id="settings-currency" formControlName="currency" readonly aria-readonly="true"></label></div></div>
