<nav class="bottom-nav" aria-label="Navegación principal">
  <ul class="bottom-nav-list">
    <li *ngFor="let item of items">
      <a
        class="bottom-nav-link"
        [routerLink]="item.path"
        routerLinkActive="is-active"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: item.path === '/' }"
        [attr.aria-label]="item.label">
        <span class="bottom-nav-icon" aria-hidden="true">
          <!-- Iconos SVG inline, sin librerías externas -->
          <svg *ngIf="item.icon === 'home'" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 10.5 12 3l9 7.5"></path>
            <path d="M5 9.5V21h14V9.5"></path>
          </svg>
          <svg *ngIf="item.icon === 'moon'" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>
          </svg>
          <svg *ngIf="item.icon === 'cup'" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 3h14l-1.5 12.5A2 2 0 0 1 15.5 17h-7A2 2 0 0 1 6.5 15.5L5 3Z"></path>
            <path d="M9 21h6"></path>
          </svg>
          <svg *ngIf="item.icon === 'card'" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="6" width="18" height="13" rx="2"></rect>
            <path d="M3 10h18"></path>
          </svg>
          <svg *ngIf="item.icon === 'user'" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4 21a8 8 0 0 1 16 0"></path>
          </svg>
        </span>
        <span class="bottom-nav-label">{{ item.label }}</span>
      </a>
    </li>
  </ul>
</nav>
